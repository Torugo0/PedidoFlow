[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "pedidoflow-local"
version = "0.1.0"
description = "Automacao local de operacoes de pedidos com Qwen3 e QLoRA"
requires-python = ">=3.10,<3.15"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
